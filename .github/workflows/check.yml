# The checks in CI (README.md): the categories, hidden.json and the app catalog, plus a dry run of the
# index builder. A pull request from a branch of this repo that only touches the categories files,
# hidden.json or catalog/ is merged (main fast-forwards to it) when it passes, and the job then starts
# publish.yml on main (a GITHUB_TOKEN push starts no push run, but a workflow_dispatch does). Recipes are
# no longer published (2026-11-16).
# App categories (README.md, "App categories"): categories.json and categories-overrides.json are
# checked by tools/check_categories.py (schema, allowed categories, package names, no personal data, at
# most 60 apps changed per pull request) and merge on their own when they pass.
# The app catalog (README.md, "App catalog"): catalog/ is checked by tools/check_catalog.py (keys, details, the
# evidence rule, at most 60 keys changed, and no confirmed game stops being one without an override or a
# review). Its files merge on their own too, except: an escalate/* branch (the reviewer agent's escalations)
# waits for the owner, and a pull request from a bot's branch (categories/*) that touches an
# overrides file waits too, so no token but the owner's can confirm a value by override.
# The values table (README.md, "Values"): catalog/values.json is checked by tools/values.py through
# tools/check_catalog.py (add-only against the base) and never merges on its own: the owner decides each value.
# Notifications Glint hides (README.md, "Hidden notifications"): hidden.json is checked by tools/check_hidden.py
# (what Glint's parser accepts, strictly, and no personal data) and merges on its own when it passes, except
# from a bot's branch (categories/*), which waits for the owner: it hides notifications on
# every phone.
name: check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches-ignore: [main] # main is checked by publish.yml

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # a pull request's merge commit and its base, for the categories' change cap

      - name: Check the app categories
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          python3 -m unittest discover -s tools
          if [ "$IS_PR" = true ]; then
            base="$RUNNER_TEMP/base-categories.json"
            git show HEAD^1:categories.json > "$base" 2>/dev/null || rm -f "$base"
            python3 tools/check_categories.py ${base:+--base "$base"}
          else
            python3 tools/check_categories.py
          fi

      - name: Check the notifications Glint hides
        run: python3 tools/check_hidden.py

      - name: Check the app catalog
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          if [ "$IS_PR" = true ]; then
            base="$RUNNER_TEMP/base-tree"
            mkdir -p "$base"
            for path in categories.json categories-overrides.json catalog; do
              if git cat-file -e "HEAD^1:$path" 2>/dev/null; then git archive HEAD^1 "$path" | tar -x -C "$base"; fi
            done
            python3 tools/check_catalog.py --base "$base"
          else
            python3 tools/check_catalog.py
          fi

      - name: Index dry run (unsigned)
        run: python3 tools/build_index.py --out "$RUNNER_TEMP/site"

  automerge:
    needs: check
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    permissions:
      actions: write # start publish.yml after merging
      contents: write
      pull-requests: write
    steps:
      - name: Only catalog files changed?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)')"
          printf '%s\n' "$files"
          other="$(printf '%s\n' "$files" | grep -vE '^(categories\.json|categories-overrides\.json|hidden\.json|catalog/(keys|apps|overrides|normalize-vectors)\.json|catalog/evidence/[^/]+\.json)$' || true)"
          if [ -n "$files" ] && [ -z "$other" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not auto-merged: the pull request changes files outside the categories files, hidden.json and catalog/."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.scope.outputs.ok == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0 # main too, to see whether the pull request fast-forwards it

      - name: A bot's branch changing an overrides file? Then it waits for the owner
        id: held
        if: steps.scope.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          why=""
          case "$HEAD_REF" in
            escalate/*) why="it holds a reviewer's question for the owner (an escalate/ branch)" ;;
            categories/*)
              if gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename' | grep -qE '^(categories-overrides\.json|catalog/overrides\.json|hidden\.json)$'; then
                why="a bot's branch changes an overrides file or hidden.json"
              fi ;;
          esac
          if [ -n "$why" ]; then
            echo "::notice::Not auto-merged: it waits for the owner's merge ($why)."
            echo "held=true" >> "$GITHUB_OUTPUT"
          else
            echo "held=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge (fast-forward)
        id: merge
        if: steps.scope.outputs.ok == 'true' && steps.held.outputs.held == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        # main moves to the pull request's own commits (GitHub then marks it merged), so no commit is made
        # here and none carries an account's email. GitHub refuses a squash merge's author email for the
        # Actions bot, and without one a squash commit would carry the pull request author's.
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git merge-base --is-ancestor origin/main "$HEAD_SHA"; then
            echo "::notice::Not auto-merged: the pull request isn't on top of main; update its branch (or merge it by hand)."
            exit 0
          fi
          git push -q "$remote" "$HEAD_SHA:refs/heads/main"
          git push -q "$remote" --delete "$HEAD_REF" || true
          gh workflow run publish.yml -R "$GITHUB_REPOSITORY" --ref main
